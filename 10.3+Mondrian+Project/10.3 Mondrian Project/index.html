<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body {
      padding: 0;
      margin: 0;
      background-color: black;
      text-align: center;
      display: flex;
      justify-content: center;
      width: fit-content;
      height: fit-content;
    }
    .container {
      height: 100vh;
      display: grid;
      gap: 0.4rem;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
    }
    .red {
      background-color: #E72F24;
      grid-area: 1/1/2/2;
    }
    .white {
      background-color: #F0F1EC;
    }
    .blue {
      background-color: #004592;
    }
    .yellow {
      background-color: #F9D01E;
    }
    .row1 {
      grid-area: 1 / 2/2/-1;
    }
    .white.row2.column1{
      grid-area:2/1/4/2
    }
    .row2.column2 {
      grid-area : 2/2/4/4;
    }
    .row2.column3{
      grid-area: 2/4/3/-1;
    }
    .yellow.row3.column2{
      grid-area: 4/2/5/3;
    }
    .row3 {
      grid-row: 3 / 4;
    }
    .column1 {
      grid-column: 1 / 2;
    }
    .column2 {
      grid-column: 2 / 3;
    }
    .column3 {
      grid-column: 3 / 4;
    }
    .white.row3.column1{
      grid-area: 4;
    }
    .white.row3.column3{
     grid-area:3/4/-1/-1
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="red"></div>
    <div class="white row1"></div>
    <div class="white row2 column1"></div>
    <div class="white row2 column2"></div>
    <div class="blue row2 column3"></div>
    <div class="white row3 column1"></div>
    <div class="yellow row3 column2"></div>
    <div class="white row3 column3"></div>
  </div>
    
    
    
    <!-- Write your HTML here -->
</body>

</html>
